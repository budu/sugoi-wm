; polybar for sugoi: workspaces and title through EWMH, the tray, and a few status
; modules. Install: copy this directory to ~/.config/polybar, then `polybar sugoi`
; (contrib/sugoi-session starts it).

[colors]
background = #222222
foreground = #aaaaaa
focused = #aa007b

; Fonts scale with the X resources' DPI (Xft.dpi); the height and the font offsets are
; pixels: 44 and 4 suit 192 DPI, 24 and 2 suit 96.
[bar/sugoi]
width = 100%
height = 44
dpi = ${xrdb:Xft.dpi:96}
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = monospace:size=10;4
font-1 = Symbols Nerd Font Mono:size=10;4
module-margin = 1
padding-right = 1
modules-left = workspaces title
modules-right = xkeyboard pulseaudio cpu memory date tray

; sugoi has 30 workspaces: only the current and occupied ones show.
[module/workspaces]
type = internal/xworkspaces
enable-scroll = true
label-active = %name%
label-active-foreground = ${colors.focused}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-padding = 1
label-empty =

[module/title]
type = internal/xwindow
label = %title:0:80:…%

; A status script's module: the script's first line is "<text> <severity>" (normal,
; warning, critical), shown colored; the rest, Pango markup, shows in a popup on click
; (sugoi-popup, doc/spec/popup.md). --then appends another command's output, and
; --unit adds a unit after the text (`status <icon> --unit % <command...>`).
; [module/updates]
; type = custom/script
; exec = ~/.config/polybar/status 󰏗 ~/bin/updates-status
; click-left = ~/.config/polybar/status --popup ~/bin/updates-status
; interval = 300

[module/xkeyboard]
type = internal/xkeyboard
format = <label-layout>

[module/pulseaudio]
type = internal/pulseaudio
label-volume = 󰕾 %percentage%%
label-muted = 󰖁 muted

[module/cpu]
type = internal/cpu
label = 󰍛 %percentage%%

[module/memory]
type = internal/memory
label = 󰘚 %percentage_used%%

[module/date]
type = internal/date
date = %a %d %b
time = %H:%M
label = %date% %time%

[module/tray]
type = internal/tray
