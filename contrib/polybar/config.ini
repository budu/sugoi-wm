; polybar for sugoi: workspaces and title through EWMH, the tray, and the awesome
; wibar's widgets. Install: ln -s ~/projects/sugoi-wm/contrib/polybar ~/.config/polybar
; (or copy), then `polybar sugoi`. The wibar's colors and the 5-minute refresh are kept.

[colors]
background = #222222
foreground = #aaaaaa
focused = #aa007b

; Fonts scale with the X resources' DPI (Xft.dpi, 192 here), as awesome's did; the
; height and offsets are pixels, sized for 192.
[bar/sugoi]
width = 100%
height = 44
dpi = ${xrdb:Xft.dpi:96}
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = monospace:size=10;4
font-1 = Symbols Nerd Font Mono:size=10;4
module-margin = 1
padding-right = 1
modules-left = workspaces title
modules-right = claude codex updates xkeyboard pulseaudio cpu date tray

; sugoi has 30 workspaces: only the current and occupied ones show.
[module/workspaces]
type = internal/xworkspaces
enable-scroll = true
label-active = %name%
label-active-foreground = ${colors.focused}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-padding = 1
label-empty =

[module/title]
type = internal/xwindow
label = %title:0:80:…%

[module/claude]
type = custom/script
exec = ~/.config/polybar/status 󰚩 ~/bin/claude-usage --awesome
click-left = ~/.config/polybar/status --popup ~/bin/claude-usage --awesome --force --then ~/bin/claude-sessions --pango
interval = 300

[module/codex]
type = custom/script
exec = ~/.config/polybar/status  ~/bin/codex-usage --awesome
click-left = ~/.config/polybar/status --popup ~/bin/codex-usage --awesome
interval = 300

[module/updates]
type = custom/script
exec = ~/.config/polybar/status 󰏗 ~/arcas/bin/arcas-update-status
click-left = ~/.config/polybar/status --popup ~/arcas/bin/arcas-update-status
click-right = systemctl --user start arcas-update-check.service
interval = 300

[module/xkeyboard]
type = internal/xkeyboard
format = <label-layout>

[module/pulseaudio]
type = internal/pulseaudio
label-volume = 󰕾 %percentage%%
label-muted = 󰖁 muted

[module/cpu]
type = internal/cpu
label = 󰍛 %percentage%%

[module/date]
type = internal/date
date = %a %d %b
time = %H:%M
label = %date% %time%

[module/tray]
type = internal/tray
