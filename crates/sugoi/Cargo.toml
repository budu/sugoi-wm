[package]
name = "sugoi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
env_logger = "0.11.11"
log = "0.4.35"
magnus = { version = "0.9", features = ["embed"] }
rustix = { version = "1.1.6", features = ["event"] }
signal-hook = "0.4.6"
x11rb = "0.14"
xkbcommon = { version = "0.9", default-features = false }

[dev-dependencies]
x11rb = { version = "0.14", features = ["xtest"] }
